<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9c5d4"><title>Worth It?｜好評 Top 6</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#593d51;background:#fff5ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 7% 17%,#ffe3ec 0,transparent 33%),radial-gradient(circle at 100% 35%,#e2e9d1 0,transparent 38%),linear-gradient(180deg,#fff2f4,#fffaf4 53%,#f4eee9)}
header{position:relative;overflow:hidden;background:radial-gradient(circle at 15% 12%,#fff4c5 0,transparent 40%),radial-gradient(circle at 85% 0%,#efcbec 0,transparent 44%),linear-gradient(135deg,#f9c5d4 0%,#e2c4ef 47%,#c5dec2 100%);color:#583b55;padding:calc(42px + env(safe-area-inset-top)) 24px 67px;border-bottom:3px solid #e6c78b}
header:after{content:"✦ ✧ ✦";position:absolute;right:24px;top:38px;opacity:.54;color:#ad7a31;letter-spacing:13px;font-size:21px}
header h1{font-size:39px;letter-spacing:.3px;margin:0;font-weight:850;text-shadow:0 1px 2px #fff9}header p{margin:10px 0 0;color:#6d4e62;font-weight:600}
main{max-width:710px;margin:-36px auto 50px;padding:0 16px;position:relative}
.panel{background:rgba(255,254,250,.96);border:1px solid #f4dfd6;border-radius:26px;padding:24px;margin-bottom:19px;box-shadow:0 9px 30px #ac73901a}
h2{font-size:22px;margin:0 0 15px;color:#68466f}label{display:block;font-weight:750;margin:14px 0 8px;color:#76556c}
input{width:100%;border:1px solid #e6cdd6;background:#fffdfa;border-radius:16px;padding:15px;font:inherit;font-size:18px;color:#54394e;outline-color:#d2a8b9}
button,.buy{border:0;background:linear-gradient(105deg,#a65b91,#9769aa 50%,#75a68b);box-shadow:0 4px 12px #a25e9329;color:#fff;font:inherit;font-weight:800;padding:16px;border-radius:15px;cursor:pointer;text-align:center;text-decoration:none}button{width:100%;margin-top:16px}button:disabled{opacity:.6;cursor:wait}
.muted{color:#8b7585;font-size:13px;line-height:1.65}.result{background:linear-gradient(140deg,#fffaf5,#fff9fe 72%,#f4faf0);border:1px solid #ead4dd;border-radius:20px;padding:17px;margin-top:13px;box-shadow:0 3px 14px #a47b7210}.rank{font-size:14px;font-weight:900;color:#b18035}.name{font-size:17px;font-weight:800;margin:8px 0 12px;color:#59405b}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stats div{background:#f7eaf1;border-radius:12px;padding:11px}.stats div:nth-child(2n){background:#eef5e8}.stats div:last-child:nth-child(odd){grid-column:1/-1;background:#eef5e8}.stats small{font-size:11px;color:#876b83;display:block;margin-bottom:5px}.stats strong{font-size:17px;color:#62425b}.buy{display:block;margin-top:12px}
.promo{border:1px solid #e9c77e;background:linear-gradient(100deg,#fff6d9,#ffeced);border-radius:14px;padding:12px;margin-top:12px}.promo-title{font-weight:850;color:#945b37}.promo-detail{font-size:13px;color:#806453;line-height:1.5;margin-top:4px}.promo-link{display:block;margin-top:10px;background:#ad7949;color:white;text-align:center;text-decoration:none;padding:11px;border-radius:11px;font-weight:800}
#status{margin-top:14px}.buy:focus-visible{outline:3px solid #d7a34b;outline-offset:2px}.tip{background:#f5edf8;border:1px solid #e4d2e8;border-radius:12px;padding:10px 12px;margin-top:12px}.reset{background:#fff;color:#785670;border:1px solid #dfcdd9;padding:9px 14px;font-size:13px;width:auto;margin-top:10px;box-shadow:none}.result{overflow-wrap:anywhere}.hidden{display:none}a{color:#975b82}footer{text-align:center;font-size:12px;color:#8c7682;margin-top:22px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #d7a34b;outline-offset:2px}
</style></head><body><header><h1>Worth It? ✦</h1><p>暖心好評 Top 6｜最低價與限時優惠</p></header><main><section class="panel"><h2>想比較什麼？</h2><label for="q">商品</label><input id="q" value="腳底按摩器"><label for="budget">預算（NT$）</label><input id="budget" type="number" min="1" value="5000" inputmode="numeric"><button id="go">搜尋好評前 6 名</button><p id="status" class="muted" role="status">依公開商品評分與評論數排序，並提供參考價格與優惠連結。</p></section><section class="panel"><h2>🏆 好評 Top 6・優惠購買</h2><div id="results" class="muted">尚未搜尋。</div><p id="restore-note" class="muted hidden">已恢復上一次搜尋結果。價格可能已變動，可按「搜尋好評前 6 名」重新查詢。</p><p class="muted">排名依公開平台彙總評價初步排序，並非實機測試。特價僅在搜尋結果提供可核對的原價、特價或折扣標示時顯示；活動仍以商店結帳頁為準。</p></section><footer>Worth It? V4.2 · 購買前請再次確認商家售價、規格、運費與保固</footer></main><script>
(() => {
  'use strict';
  const WORKER = 'https://worth-it-search.bk6s9zw8rb.workers.dev';
  const STORAGE = 'worthit-v41-search-state';
  const TIMEOUT_MS = 30000;
  const $ = id => document.getElementById(id);
  const money = n => new Intl.NumberFormat('zh-TW', {style:'currency', currency:'TWD', maximumFractionDigits:0}).format(n);
  const txt = (tag, value='', cls='') => {
    const e = document.createElement(tag);
    e.textContent = value ?? '';
    if(cls) e.className = cls;
    return e;
  };
  const message = text => { $('status').textContent = text; };
  function safeUrl(value) {
    try {
      const u = new URL(value);
      return u.protocol === 'https:' ? u.href : null;
    } catch { return null; }
  }
  function readState() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE) || 'null');
      return data && typeof data === 'object' ? data : null;
    } catch { return null; }
  }
  let lastData = null;
  let lastQuery = '';
  let lastBudget = 0;
  let inFlight = null;
  function remember() {
    if (!lastData) return;
    try {
      localStorage.setItem(STORAGE, JSON.stringify({
        q: lastQuery, budget: lastBudget, data: lastData,
        scrollY: window.scrollY, savedAt: Date.now()
      }));
    } catch { /* Storage unavailable: current page still works. */ }
  }
  function link(text, href, cls) {
    const url = safeUrl(href);
    if (!url) return null;
    const a = txt('a', text, cls);
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    // Save position before iOS/Safari opens the merchant page.
    a.addEventListener('click', remember);
    return a;
  }
  function show(data, restored=false) {
    const root = $('results');
    root.replaceChildren();
    root.classList.remove('muted');
    const products = Array.isArray(data?.products) ? data.products.slice(0, 6) : [];
    if (!products.length) {
      root.append(txt('p', '這次沒有找到符合預算的商品。請調整商品名稱或預算再搜尋。', 'muted'));
    }
    products.forEach((p,i) => {
      const art = txt('article', '', 'result');
      art.append(txt('div', `第 ${i+1} 名${p.feedbackScore == null ? '（評價證據不足）' : ''}`, 'rank'));
      art.append(txt('div', p.title || '未提供商品名稱', 'name'));
      const stats = txt('div', '', 'stats');
      const stat = (label,value) => {
        const e = txt('div');
        e.append(txt('small',label),txt('strong',value));
        stats.append(e);
      };
      stat('網路評分', Number.isFinite(p.rating) ? `${p.rating}/5 ★` : '未公開');
      stat('評論數', Number.isFinite(p.reviewCount) ? `${p.reviewCount} 則` : '未公開');
      stat('本次找到參考價格', Number.isFinite(p.price) ? money(p.price) : '未取得');
      art.append(stats);
      if (p.promotion?.link) {
        const promo = txt('div', '', 'promo');
        promo.append(txt('div', '✦ 來源有促銷資訊', 'promo-title'));
        const details = [];
        if(Number.isFinite(p.promotion.originalPrice) && Number.isFinite(p.promotion.price) && p.promotion.originalPrice > p.promotion.price) {
          details.push(`參考原價 ${money(p.promotion.originalPrice)} → 促銷價 ${money(p.promotion.price)}`);
        }
        if(p.promotion.label) details.push(String(p.promotion.label));
        promo.append(txt('div', details.join('｜') || '請以店家結帳頁為準', 'promo-detail'));
        const promoLink = link('查看特價促銷 ↗', p.promotion.link, 'promo-link');
        if(promoLink) promo.append(promoLink);
        art.append(promo);
      }
      art.append(txt('p', p.evidence || '評價資料不足，請自行確認', 'muted'));
      if (p.offerCount > 1) art.append(txt('p', `搜尋來源提供 ${p.offerCount} 筆報價；請確認同款同規格`, 'muted'));
      const buy = link('查看購買／比價連結 ↗', p.link, 'buy');
      if (buy) art.append(buy);
      art.append(txt('p','購物連結將嘗試另開頁面；返回 Worth It? 時，上次搜尋結果會保留。','muted'));
      root.append(art);
    });
    const checked = data.checkedAt && !Number.isNaN(Date.parse(data.checkedAt))
      ? new Date(data.checkedAt).toLocaleString('zh-TW', {timeZone:'Asia/Taipei'}) : '未知';
    message(`${restored?'已恢復':'已找到'} ${products.length} 項商品｜資料查詢時間 ${checked}`);
    $('restore-note').classList.toggle('hidden',!restored);
  }
  const saved = readState();
  if(saved) {
    if(typeof saved.q === 'string') $('q').value = saved.q;
    if(Number.isFinite(Number(saved.budget)) && Number(saved.budget)>0) $('budget').value = saved.budget;
    if(saved.data && Array.isArray(saved.data.products)) {
      lastData = saved.data;
      lastQuery = saved.q || '';
      lastBudget = Number(saved.budget) || 0;
      show(saved.data,true);
      if(Number.isFinite(saved.scrollY) && saved.scrollY >= 0) {
        requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0,saved.scrollY)));
      }
    }
  }
  async function search() {
    if(inFlight) return;
    const q = $('q').value.trim();
    const budget = Number($('budget').value);
    if(q.length < 2 || !Number.isFinite(budget) || budget <= 0) {
      message('請輸入至少兩個字的商品名稱和有效預算');
      return;
    }
    const button = $('go');
    const controller = new AbortController();
    inFlight = controller;
    button.disabled = true;
    button.textContent = '搜尋中…';
    message('正在查找商品、評價與價格…');
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
    try {
      const url = WORKER + '/search?' + new URLSearchParams({q,budget:String(budget)});
      const res = await fetch(url, {signal:controller.signal});
      const raw = await res.text();
      let data;
      try { data = JSON.parse(raw); } catch { throw new Error('搜尋服務暫時無法回傳有效資料'); }
      if(!res.ok) throw new Error(data?.error || `搜尋服務暫時無法使用（${res.status}）`);
      if(!data || !Array.isArray(data.products)) throw new Error('搜尋結果格式有誤');
      lastData = data;
      lastQuery = q;
      lastBudget = budget;
      show(data);
      remember();
    } catch(error) {
      const detail = error?.name === 'AbortError'
        ? '搜尋逾時。請稍後重試，先前的搜尋結果仍會保留。'
        : `搜尋失敗：${error?.message || '連線異常'}。先前的搜尋結果仍會保留。`;
      message(detail);
    } finally {
      clearTimeout(timer);
      inFlight = null;
      button.disabled = false;
      button.textContent = '搜尋好評前 6 名';
    }
  }
  $('go').addEventListener('click', search);
  window.addEventListener('pagehide', remember);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState==='hidden') remember(); });
  window.addEventListener('pageshow', e => {
    if(e.persisted && lastData) {
      show(lastData, true);
      const saved = readState();
      if(saved && Number.isFinite(saved.scrollY)) requestAnimationFrame(() => window.scrollTo(0,saved.scrollY));
    }
  });
})();
</script></body></html>
