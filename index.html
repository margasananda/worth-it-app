<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0e6671"><title>Worth It?｜AI CP 值比較王</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",system-ui,sans-serif;color:#19383e;background:#f5f8f7}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(135deg,#095d69,#30a5a6);color:white;padding:calc(28px + env(safe-area-inset-top)) 20px 30px}main{max-width:720px;margin:-14px auto 50px;padding:0 16px}h1{margin:0 0 5px;font-size:32px}h2{font-size:19px;margin:0 0 12px}.sub{opacity:.92;margin:0}.panel{background:white;border-radius:20px;box-shadow:0 4px 20px #103b3c0d;padding:20px;margin-bottom:16px}label{font-weight:650;font-size:14px;display:block;margin-bottom:7px}input,select{font:inherit;width:100%;border:1px solid #c9d9dc;border-radius:12px;padding:12px;margin-bottom:12px;background:white;color:#143d43}button,.cta{font:inherit;display:inline-block;border:0;border-radius:12px;padding:12px 16px;background:#0c7881;color:white;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}button.secondary,.cta.secondary{background:#e6f5f4;color:#0e626a}.full{width:100%}.searchlinks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.muted{color:#637c7f;font-size:13px;line-height:1.6}.notice{background:#eef7f3;padding:12px;border-radius:12px;color:#305a55;font-size:13px;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px;justify-content:space-between;align-items:center}.entry{border:1px solid #e0e9e8;border-radius:14px;padding:14px;margin:10px 0}.entry h3{margin:0 0 8px}.tag{font-size:12px;color:#097683;background:#e6f5f4;border-radius:20px;padding:5px 9px}.score{font-size:24px;font-weight:800;color:#0b6b73}a{color:#087a84;word-break:break-word}.foot{font-size:12px;color:#6d8789;text-align:center;padding:8px}#results:empty::after{content:'還沒有比較商品。先從購物網站找到商品，再輸入已核實的資料。';display:block;color:#728b8e;padding:12px 0}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #f6b764;outline-offset:2px}@media(max-width:370px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Worth It? ✦</h1><p class="sub">AI CP 值比較王｜聰明比價，不花冤枉錢</p></header>
<main>
<section class="panel"><h2>🔍 搜尋台灣商品</h2><label for="query">想買什麼？</label><input id="query" placeholder="例如：腳底按摩器" value="腳底按摩器"><label for="budget">預算上限（NT$）</label><input id="budget" type="number" min="1" inputmode="numeric" value="5000"><div class="searchlinks"><button id="shopping">Google 購物</button><button id="reviews" class="secondary">搜尋真實評價</button><button id="pchome" class="secondary">PChome 搜尋</button><button id="momo" class="secondary">momo 搜尋</button></div><p class="muted">以上按鈕會開啟各平台的搜尋結果，價格和評價需在來源網站核對。</p></section>
<section class="panel"><h2>📊 我的商品比較</h2><div class="notice">目前為免費靜態試用版：不會假裝已自動爬取評價。請先從來源網站核實價格與評論，再輸入進行排序。未來接上後端 API 才能自動比較。</div><form id="productForm"><label for="name">商品品牌與型號</label><input id="name" required placeholder="例如：某品牌按摩器 ABC-123"><div class="grid"><div><label for="price">實際價格（NT$）</label><input id="price" required type="number" inputmode="numeric" min="1" placeholder="例如：2980"></div><div><label for="rating">來源評分（0–5，可不填）</label><input id="rating" type="number" inputmode="decimal" min="0" max="5" step="0.1" placeholder="例如：4.4"></div></div><label for="count">評價數量（可不填）</label><input id="count" type="number" min="0" inputmode="numeric" placeholder="例如：86"><label for="source">來源網址（必填）</label><input id="source" type="url" required placeholder="https://..."><button type="submit" class="full">加入比較清單</button></form></section>
<section class="panel"><div class="row"><h2>🏆 比較結果</h2><button class="secondary" id="clear" type="button">清空</button></div><p class="muted">簡易 CP 指標：價格 60% + 來源星等 40%；評分缺少時只依價格比較，並標示「評價資料不足」。這不等於品質、耐用度或 AI 真實評測。</p><div id="results" aria-live="polite"></div></section>
<p class="foot">Worth It? MVP · 所有資料由使用者核實輸入，儲存在此裝置瀏覽器。勿輸入個資或 API 金鑰。</p></main>
<script>
(function(){'use strict';var qs=x=>document.querySelector(x);var key='worthit-products-v1';var items=[];try{items=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(items))items=[]}catch(e){}function q(){return qs('#query').value.trim()||'腳底按摩器'}function budget(){return parseInt(qs('#budget').value,10)||5000}function open(url){window.open(url,'_blank','noopener,noreferrer')}qs('#shopping').onclick=()=>open('https://www.google.com/search?tbm=shop&q='+encodeURIComponent(q()+' 台灣 '+budget()+'元以下'));qs('#reviews').onclick=()=>open('https://www.google.com/search?q='+encodeURIComponent(q()+' 開箱 評價 缺點 PTT Mobile01'));qs('#pchome').onclick=()=>open('https://ecshweb.pchome.com.tw/search/v3.3/?q='+encodeURIComponent(q()));qs('#momo').onclick=()=>open('https://www.momoshop.com.tw/search/searchShop.jsp?keyword='+encodeURIComponent(q()));function save(){localStorage.setItem(key,JSON.stringify(items))}function el(tag,content,cls){var n=document.createElement(tag);if(content!=null)n.textContent=content;if(cls)n.className=cls;return n}function render(){var container=qs('#results');container.replaceChildren();var b=budget();var eligible=items.filter(x=>x.price<=b);if(items.length===0)return;if(eligible.length===0){container.append(el('p','目前紀錄的商品都超過預算。','muted'));return}var min=Math.min(...eligible.map(x=>x.price));eligible.forEach(x=>x.score=Math.round(100*(.6*Math.min(1,min/x.price)+.4*(x.rating==null?0.5:x.rating/5))));eligible.sort((a,b)=>b.score-a.score);eligible.forEach((x,i)=>{var card=el('article',null,'entry'),r=el('div',null,'row'),h=el('h3',(i+1)+'. '+x.name),score=el('span',x.score+'/100','score');r.append(h,score);card.append(r,el('p','NT$'+x.price.toLocaleString('zh-TW')+(x.rating==null?' · 評價資料不足':' · 星等 '+x.rating+'/5（'+(x.count||0)+' 筆）'),'muted'));var a=el('a','查看原始來源');a.href=x.source;a.target='_blank';a.rel='noopener noreferrer';card.append(a);var del=el('button','移除','secondary');del.style.marginLeft='12px';del.onclick=()=>{items=items.filter(y=>y.id!==x.id);save();render()};card.append(del);container.append(card)})}qs('#productForm').onsubmit=function(e){e.preventDefault();var name=qs('#name').value.trim(),price=Number(qs('#price').value),ratingTxt=qs('#rating').value,count=Number(qs('#count').value)||0,source=qs('#source').value.trim();if(!name||!Number.isFinite(price)||price<=0)return;var u;try{u=new URL(source)}catch(e){alert('請輸入有效網址');return}if(u.protocol!=='https:'&&u.protocol!=='http:'){alert('請輸入 http 或 https 網址');return}var rating=ratingTxt===''?null:Number(ratingTxt);if(rating!==null&&(rating<0||rating>5)){alert('評分需介於 0–5');return}items.push({id:Date.now()+'-'+Math.random(),name,price,rating,count,source:u.href});save();this.reset();render()};qs('#budget').oninput=render;qs('#clear').onclick=()=>{if(confirm('清空此裝置儲存的比較商品？')){items=[];save();render()}};render()})();
</script></body></html>
