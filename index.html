<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9c5d4"><title>Worth It?｜好評 Top 6</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#593d51;background:#fff5ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 7% 17%,#ffe3ec 0,transparent 33%),radial-gradient(circle at 100% 35%,#e2e9d1 0,transparent 38%),linear-gradient(180deg,#fff2f4,#fffaf4 53%,#f4eee9)}
header{position:relative;overflow:hidden;background:radial-gradient(circle at 15% 12%,#fff4c5 0,transparent 40%),radial-gradient(circle at 85% 0%,#efcbec 0,transparent 44%),linear-gradient(135deg,#f9c5d4 0%,#e2c4ef 47%,#c5dec2 100%);color:#583b55;padding:calc(42px + env(safe-area-inset-top)) 24px 67px;border-bottom:3px solid #e6c78b}
header:after{content:"✦ ✧ ✦";position:absolute;right:24px;top:38px;opacity:.54;color:#ad7a31;letter-spacing:13px;font-size:21px}
header h1{font-size:39px;letter-spacing:.3px;margin:0;font-weight:850;text-shadow:0 1px 2px #fff9}header p{margin:10px 0 0;color:#6d4e62;font-weight:600}
main{max-width:710px;margin:-36px auto 50px;padding:0 16px;position:relative}
.panel{background:rgba(255,254,250,.96);border:1px solid #f4dfd6;border-radius:26px;padding:24px;margin-bottom:19px;box-shadow:0 9px 30px #ac73901a}
h2{font-size:22px;margin:0 0 15px;color:#68466f}label{display:block;font-weight:750;margin:14px 0 8px;color:#76556c}
input{width:100%;border:1px solid #e6cdd6;background:#fffdfa;border-radius:16px;padding:15px;font:inherit;font-size:18px;color:#54394e;outline-color:#d2a8b9}
button,.buy{border:0;background:linear-gradient(105deg,#a65b91,#9769aa 50%,#75a68b);box-shadow:0 4px 12px #a25e9329;color:#fff;font:inherit;font-weight:800;padding:16px;border-radius:15px;cursor:pointer;text-align:center;text-decoration:none}button{width:100%;margin-top:16px}button:disabled{opacity:.6}
.muted{color:#8b7585;font-size:13px;line-height:1.65}.result{background:linear-gradient(140deg,#fffaf5,#fff9fe 72%,#f4faf0);border:1px solid #ead4dd;border-radius:20px;padding:17px;margin-top:13px;box-shadow:0 3px 14px #a47b7210}.rank{font-size:14px;font-weight:900;color:#b18035}.name{font-size:17px;font-weight:800;margin:8px 0 12px;color:#59405b}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stats div{background:#f7eaf1;border-radius:12px;padding:11px}.stats div:nth-child(2n){background:#eef5e8}.stats small{font-size:11px;color:#876b83;display:block;margin-bottom:5px}.stats strong{font-size:17px;color:#62425b}.buy{display:block;margin-top:12px}
.promo{border:1px solid #e9c77e;background:linear-gradient(100deg,#fff6d9,#ffeced);border-radius:14px;padding:12px;margin-top:12px}.promo-title{font-weight:850;color:#945b37}.promo-detail{font-size:13px;color:#806453;line-height:1.5;margin-top:4px}.promo-link{display:block;margin-top:10px;background:#ad7949;color:white;text-align:center;text-decoration:none;padding:11px;border-radius:11px;font-weight:800}
#status{margin-top:14px}.hidden{display:none}details{margin-top:20px;color:#81687a}summary{cursor:pointer;font-weight:700}a{color:#975b82}footer{text-align:center;font-size:12px;color:#8c7682;margin-top:22px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #d7a34b;outline-offset:2px}
</style></head><body><header><h1>Worth It? ✦</h1><p>暖心好評 Top 6｜最低價與限時優惠</p></header><main><section class="panel"><h2>想比較什麼？</h2><label for="q">商品</label><input id="q" value="腳底按摩器"><label for="budget">預算（NT$）</label><input id="budget" type="number" min="1" value="5000" inputmode="numeric"><button id="go">搜尋好評前 6 名</button><p id="status" class="muted" role="status">依公開商品評分、評論數排序。未取得的銷量不會猜測。</p><details><summary>初次使用：設定搜尋服務</summary><p class="muted">需要先將隨附 worker.js 部署到 Cloudflare Workers，設定 SERPAPI_KEY，再將公開的 Worker 網址貼在這裡。請不要輸入任何私密金鑰。</p><label for="api">Cloudflare Worker 網址</label><input id="api" type="url" placeholder="https://example.workers.dev"><button id="save">儲存搜尋服務網址</button></details></section><section class="panel"><h2>🏆 好評 Top 6・優惠購買</h2><div id="results" class="muted">尚未搜尋。</div><p class="muted">排名依公開平台彙總評價初步排序，並非實機測試。特價僅在搜尋結果提供可核對的原價、特價或折扣標示時顯示；活動仍以商店結帳頁為準。</p></section><footer>Worth It? V4 · 購買前請再次確認商家售價、規格、運費與保固</footer></main><script>
(()=>{'use strict';const $=s=>document.getElementById(s),KEY='worthit-worker-url';$('api').value=localStorage.getItem(KEY)||'';const txt=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value??'';if(cls)e.className=cls;return e};function message(s){$('status').textContent=s}function safeUrl(s){try{const u=new URL(s);return u.protocol==='https:'?u.href:null}catch{return null}}$('save').onclick=()=>{const v=safeUrl($('api').value.trim());if(!v){message('請填入 https:// 開頭的網址');return}localStorage.setItem(KEY,new URL(v).origin);message('已儲存搜尋服務，現在可以搜尋')};const money=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n);
function show(data){const root=$('results');root.replaceChildren();const products=Array.isArray(data.products)?data.products:[];if(!products.length){root.append(txt('p','這次沒有找到符合預算且有有效商品連結的結果。'));return}products.forEach((p,i)=>{const art=txt('article',null,'result');art.append(txt('div',`第 ${i+1} 名${p.feedbackScore==null?'（評價證據不足）':''}`,'rank'));art.append(txt('div',p.title,'name'));const stats=txt('div',null,'stats');function stat(label,value){const e=txt('div');e.append(txt('small',label),txt('strong',value));stats.append(e)}stat('網路評分',p.rating==null?'未公開':`${p.rating}/5 ★`);stat('評論數',p.reviewCount==null?'未公開':`${p.reviewCount} 則`);stat('銷售量',p.salesVolume||'未公開');stat('本次找到最低價',Number.isFinite(p.price)?money(p.price):'未取得');art.append(stats);
if(p.promotion&&p.promotion.link){
 const promo=txt('div',null,'promo');
 promo.append(txt('div','✦ 目前有促銷資訊','promo-title'));
 const details=[];
 if(p.promotion.originalPrice>p.promotion.price)details.push(`參考原價 ${money(p.promotion.originalPrice)} → 特價 ${money(p.promotion.price)}`);
 if(p.promotion.label)details.push(p.promotion.label);
 promo.append(txt('div',details.join('｜')||'來源顯示促銷標示，請在結帳頁確認','promo-detail'));
 const promoUrl=safeUrl(p.promotion.link);
 if(promoUrl){const a=txt('a','查看特價促銷 ↗','promo-link');a.href=promoUrl;a.target='_blank';a.rel='noopener noreferrer';promo.append(a)}
 art.append(promo);
}
art.append(txt('p',p.evidence||'資料不足','muted'));if(p.offerCount>1)art.append(txt('p',`比對 ${p.offerCount} 筆同款報價（僅限本次搜尋）`,'muted'));const url=safeUrl(p.link);if(url){const a=txt('a','查看最低價購買連結 →','buy');a.href=url;a.target='_blank';a.rel='noopener noreferrer';art.append(a)}root.append(art)});const checked=data.checkedAt?new Date(data.checkedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'未知';message(`已找到 ${products.length} 項商品｜查詢時間 ${checked}`)}$('go').onclick=async()=>{const q=$('q').value.trim(),b=Number($('budget').value),api=localStorage.getItem(KEY);if(q.length<2||!Number.isFinite(b)||b<=0){message('請輸入商品名稱和有效預算');return}if(!api){message('請先展開「初次使用：設定搜尋服務」，儲存 Cloudflare Worker 網址');return}const btn=$('go');btn.disabled=true;btn.textContent='搜尋中…';message('正在查找商品、評價及最低價…');try{const r=await fetch(api+'/search?'+new URLSearchParams({q,budget:String(b)}));const result=await r.json();if(!r.ok)throw Error(result.error||'搜尋服務錯誤');show(result)}catch(e){message('搜尋失敗：'+e.message)}finally{btn.disabled=false;btn.textContent='搜尋好評前 6 名'}};
})();
</script></body></html>
